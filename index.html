<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --work-color: #e55050;
      --break-color: #4caf85;
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #eaeaea;
      --muted: #8888aa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      background: var(--card);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      width: min(420px, 92vw);
      box-shadow: 0 8px 40px #0006;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 36px;
      background: #0003;
      border-radius: 12px;
      padding: 4px;
    }

    .mode-tabs button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all .2s;
    }

    .mode-tabs button.active {
      background: var(--accent);
      color: #fff;
    }

    .timer-ring {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 36px;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .ring-bg { fill: none; stroke: #ffffff12; stroke-width: 8; }
    .ring-fg { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .9s linear, stroke .4s; }

    .timer-display {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .time {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }

    .session-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .btn-main {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px #0004;
      transition: transform .1s, opacity .1s;
    }

    .btn-main:active { transform: scale(.93); }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #ffffff18;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s, border-color .2s;
    }

    .btn-icon:hover { color: var(--text); border-color: #ffffff33; }

    .sessions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff18;
      transition: background .3s;
    }

    .dot.done { background: var(--accent); }

    .settings {
      border-top: 1px solid #ffffff0f;
      padding-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .setting label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .setting input {
      width: 100%;
      background: #0003;
      border: 1px solid #ffffff12;
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 8px 10px;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }

    .setting input:focus { border-color: var(--accent); }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="mode-tabs">
    <button id="tab-work" class="active" onclick="switchMode('work')">Работа</button>
    <button id="tab-short" onclick="switchMode('short')">Короткий перерыв</button>
    <button id="tab-long" onclick="switchMode('long')">Длинный перерыв</button>
  </div>

  <div class="timer-ring">
    <svg viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="100"/>
      <circle class="ring-fg" id="ring" cx="110" cy="110" r="100"/>
    </svg>
    <div class="timer-display">
      <div class="time" id="display">25:00</div>
      <div class="session-label" id="session-label">Сессия 1</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-icon" title="Сбросить" onclick="reset()">↺</button>
    <button class="btn-main" id="btn-play" onclick="toggle()">▶</button>
    <button class="btn-icon" title="Следующий" onclick="skip()">⏭</button>
  </div>

  <div class="sessions" id="dots"></div>

  <div class="settings">
    <div class="setting">
      <label>Работа (мин)</label>
      <input type="number" id="cfg-work" value="25" min="1" max="99" onchange="onCfgChange()"/>
    </div>
    <div class="setting">
      <label>Короткий перерыв</label>
      <input type="number" id="cfg-short" value="5" min="1" max="99" onchange="onCfgChange()"/>
    </div>
    <div class="setting">
      <label>Длинный перерыв</label>
      <input type="number" id="cfg-long" value="15" min="1" max="99" onchange="onCfgChange()"/>
    </div>
    <div class="setting">
      <label>Сессий до длинного</label>
      <input type="number" id="cfg-sessions" value="4" min="1" max="12" onchange="onCfgChange()"/>
    </div>
  </div>
</div>

<script>
const CIRCUMFERENCE = 2 * Math.PI * 100; // ~628.3

const state = {
  mode: 'work',       // 'work' | 'short' | 'long'
  running: false,
  remaining: 0,
  total: 0,
  sessionsDone: 0,
  interval: null,
};

function cfg() {
  return {
    work:     parseInt(document.getElementById('cfg-work').value) || 25,
    short:    parseInt(document.getElementById('cfg-short').value) || 5,
    long:     parseInt(document.getElementById('cfg-long').value) || 15,
    sessions: parseInt(document.getElementById('cfg-sessions').value) || 4,
  };
}

function durationFor(mode) {
  const c = cfg();
  return { work: c.work, short: c.short, long: c.long }[mode] * 60;
}

function accent(mode) {
  return mode === 'work' ? 'var(--work-color)' : 'var(--break-color)';
}

function switchMode(mode, autoStart = false) {
  if (state.running) clearInterval(state.interval);
  state.running = false;
  state.mode = mode;
  const dur = durationFor(mode);
  state.remaining = dur;
  state.total = dur;

  document.getElementById('tab-work').classList.toggle('active', mode === 'work');
  document.getElementById('tab-short').classList.toggle('active', mode === 'short');
  document.getElementById('tab-long').classList.toggle('active', mode === 'long');

  const color = accent(mode);
  document.documentElement.style.setProperty('--accent', color);
  document.getElementById('ring').style.stroke = color;
  document.getElementById('btn-play').style.background = color;

  render();
  if (autoStart) startTimer();
}

function render() {
  const m = String(Math.floor(state.remaining / 60)).padStart(2, '0');
  const s = String(state.remaining % 60).padStart(2, '0');
  document.getElementById('display').textContent = `${m}:${s}`;
  document.title = `${m}:${s} — Pomodoro`;

  const ratio = state.total > 0 ? state.remaining / state.total : 1;
  const offset = CIRCUMFERENCE * (1 - ratio);
  document.getElementById('ring').style.strokeDasharray = CIRCUMFERENCE;
  document.getElementById('ring').style.strokeDashoffset = offset;

  document.getElementById('btn-play').textContent = state.running ? '⏸' : '▶';

  const label = state.mode === 'work'
    ? `Сессия ${state.sessionsDone + 1}`
    : state.mode === 'short' ? 'Короткий перерыв' : 'Длинный перерыв';
  document.getElementById('session-label').textContent = label;

  renderDots();
}

function renderDots() {
  const { sessions } = cfg();
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  for (let i = 0; i < sessions; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < state.sessionsDone ? ' done' : '');
    dots.appendChild(d);
  }
}

function startTimer() {
  state.running = true;
  render();
  state.interval = setInterval(() => {
    state.remaining--;
    render();
    if (state.remaining <= 0) {
      clearInterval(state.interval);
      state.running = false;
      onSessionEnd();
    }
  }, 1000);
}

function toggle() {
  if (state.running) {
    clearInterval(state.interval);
    state.running = false;
    render();
  } else {
    startTimer();
  }
}

function reset() {
  clearInterval(state.interval);
  state.running = false;
  state.remaining = durationFor(state.mode);
  state.total = state.remaining;
  render();
}

function skip() {
  clearInterval(state.interval);
  state.running = false;
  onSessionEnd();
}

function onSessionEnd() {
  notify();
  const { sessions } = cfg();
  if (state.mode === 'work') {
    state.sessionsDone++;
    if (state.sessionsDone >= sessions) {
      state.sessionsDone = 0;
      switchMode('long', true);
    } else {
      switchMode('short', true);
    }
  } else {
    switchMode('work', true);
  }
}

function notify() {
  const messages = {
    work: 'Время работы вышло! Сделайте перерыв.',
    short: 'Перерыв окончен! Пора работать.',
    long: 'Длинный перерыв окончен! Пора работать.',
  };
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Pomodoro', { body: messages[state.mode], icon: '' });
  }
}

function onCfgChange() {
  if (!state.running) {
    state.remaining = durationFor(state.mode);
    state.total = state.remaining;
    render();
  }
}

// Init
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

switchMode('work');
</script>
</body>
</html>
